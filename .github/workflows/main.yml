name: Run NET Tests

on:  
  push:  
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout Repository  
        uses: actions/checkout@v4  

      - name: Set up .NET  
        uses: actions/setup-dotnet@v4  
        with:
          dotnet-version: '9.0.x'  

      - name: Restore Dependencies  
        run: dotnet restore apiTests  

      - name: Build Solution  
        run: dotnet build apiTests --configuration Release --no-restore  

      - name: Run Tests  
        run: dotnet test apiTests 
