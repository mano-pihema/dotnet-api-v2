name: Run NET Tests

on:  
  push:  
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout Repository  
        uses: actions/checkout@v3  

      - name: Set up .NET  
        uses: actions/setup-dotnet@v3  
        with:
          dotnet-version: '9.0.x'  

      - name: Restore Dependencies  
        run: dotnet restore apitests  

      - name: Build Solution  
        run: dotnet build apitests --configuration Release --no-restore  

      - name: Run Tests  
        run: dotnet test apitests --configuration Release --no-build --logger trx --results-directory TestResults  

      - name: Upload Test Results  
        uses: actions/upload-artifact@v3  
        with:
          name: TestResults  
          path: project/apitests/TestResults
